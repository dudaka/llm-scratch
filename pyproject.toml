[project]
name = "llm-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dudaka", email = "htdung820@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "tiktoken>=0.14.0",
]

[project.scripts]
llm-scratch = "llm_scratch:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
